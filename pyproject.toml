[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "certbot-dns-route53-less"
version = "2.0.0"
description = "Route53 DNS Authenticator plugin for Certbot which requires less privileges"
readme = "README.md"
license = { text = "Apache License 2.0" }
authors = [{ name = "Certbot Project + Link-U, Inc." }]
requires-python = ">=3.9"
dependencies = [
    "acme>=5.0.0",
    "certbot>=5.0.0",
    "boto3",
]
classifiers = [
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Source = "https://github.com/link-u/certbot-dns-route53-less"

[project.entry-points."certbot.plugins"]
dns-route53-less = "certbot_dns_route53_less._internal.dns_route53:Authenticator"

[tool.setuptools.packages.find]
include = ["certbot_dns_route53_less*"]
